<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="acadEats/styles.css">
    <meta charset="UTF-8" />

    <title>acadEats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

 <script src="acadEats/app.js"></script>
